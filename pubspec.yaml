name: jyotish
description: A production-ready Flutter library for Vedic astrology (Jyotish) calculations using Swiss Ephemeris. Provides high-precision sidereal planetary positions with Lahiri ayanamsa, nakshatras, and complete birth chart analysis.
version: 2.19.0
homepage: https://github.com/rajsanjib/jyotish-flutter-library
repository: https://github.com/rajsanjib/jyotish-flutter-library
issue_tracker: https://github.com/rajsanjib/jyotish-flutter-library/issues
topics:
  - astrology
  - vedic-astrology
  - jyotish
  - ephemeris
  - swiss-ephemeris

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path: ^1.9.0
  timezone: ^0.11.0
  synchronized: ^3.1.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl: ^0.20.2
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
